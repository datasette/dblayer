[project]
name = "dblayer"
version = "0.1.0a0"
description = "Research prototype: an asyncio database layer that never hands out a raw connection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
postgres = ["asyncpg"]
duckdb = ["duckdb"]
msgpack = ["msgpack"]
psycopg = ["psycopg[binary]"]
wasm = ["wasmtime"]
# Experimental in-process SQLite on apsw (bundles its own SQLite).
apsw = ["apsw>=3.50"]
# Experimental ClickHouse backend: chDB, ClickHouse embedded in-process.
# chDB 4.5 ships no binding for Python 3.15 yet.
clickhouse = ["chdb>=4.5; python_version < '3.15'"]

[dependency-groups]
demo = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dblayer", "dblayer.*"]
# dblayer_demo/ (the demo app) is not part of the distribution.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A passing test's tmp_path is removed at its teardown. The suite makes
# tens of gigabytes of databases in one session (a PGlite data directory is
# about 40 MB; the full run filled 45 GB on macOS), more than a CI runner's
# free disk; a failed test's directory is kept for inspection.
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
markers = [
    "requires(*flags): skip unless the backend has every named capability flag set",
    "requires_not(*flags): skip if the backend has any named capability flag set",
    "scale: many-database scale tests (tests/scale); deselect with -m 'not scale'",
]
