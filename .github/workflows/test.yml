name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run at a time per branch. On main a newer push waits (GitHub keeps only
# the newest waiting run) rather than cancelling the run in progress: with
# several pushes a minute, cancelling would mean no run ever finishes, and
# every job now has a timeout, so a waiting run starts within about 45
# minutes at worst. Pull requests cancel: only their newest commit matters.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hang diagnostics for every pytest run: a test still running after 240 s
# dumps its threads, asyncio tasks and child processes (tests/hangdump.py,
# also appended to hang-dump.txt); pytest-timeout fails it at 300 s. The
# signal method fails just that test and the run goes on (the thread method
# ended the whole run at the first slow test); a hang where Python cannot
# take the signal is left to the job's timeout-minutes. -v names each test
# as it starts, so a killed runner's log ends at the test that was running.
env:
  PYTEST_ADDOPTS: -v --durations=30 --timeout=300 --timeout-method=signal
  DBLAYER_HANG_DUMP_S: "240"
  DBLAYER_HANG_DUMP_FILE: ${{ github.workspace }}/hang-dump.txt
  # The Rust jobs' toolchain (the Rust DuckDB and SQLite workers).
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  # The Linux suite runs as one job per backend family (DBLAYER_CI_SHARD,
  # tests/ci_shards.py): every test belongs to exactly one family, so these
  # jobs together run the whole suite once, each on its own runner with only
  # the builds its family needs. The core family runs on every supported
  # Python; the heavy families on the newest.
  core:
    name: Linux core, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dblayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBLAYER_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/dblayer_test
      DBLAYER_CI_SHARD: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # In-process SQLite (stdlib and apsw), PostgreSQL (asyncpg and
      # psycopg), the API, dialects and the demo app on those backends.
      - name: Run the core family's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras --group demo pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  workers:
    name: Linux SQLite workers, Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBLAYER_CI_SHARD: workers
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      # The experimental C worker (cworker/): downloads the pinned SQLite
      # amalgamation and builds one binary, so the sqlite-cworker tests run.
      - name: Build the C worker
        run: make -C cworker
      - name: Run the SQLite worker family's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras --group demo pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  duckdb:
    # In-process DuckDB and the Python DuckDB worker. The C++ and Rust
    # DuckDB workers are built and tested by their own jobs below.
    name: Linux DuckDB, Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBLAYER_CI_SHARD: duckdb
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run the DuckDB family's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras --group demo pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  wasm-node:
    name: Linux SQLite in WebAssembly and Node.js, Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBLAYER_CI_SHARD: wasm-node
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      # SQLite in WebAssembly (sqlite-wasm): a cached, checksummed wasi-sdk
      # plus about 10 s of compiling.
      - uses: actions/cache@v4
        with:
          path: cworker/vendor/wasi-sdk-34.0-*-*/
          key: wasi-sdk-34-${{ runner.os }}-${{ runner.arch }}
      - name: Build the SQLite WebAssembly module
        run: make -C cworker wasm
      # SQLite-WASM in a Node.js process (nodeworker/, sqlite-nodeworker):
      # the pinned @sqlite.org/sqlite-wasm package, no build step.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install the Node worker's npm packages
        run: npm ci --prefix nodeworker
      - name: Run the WebAssembly and Node family's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras --group demo pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  pglite:
    # The experimental PGlite backend (pglite-worker/, PostgreSQL in
    # WebAssembly in a Node.js process): the pinned npm package, no build.
    # The server is only for the differential test against psycopg.
    name: Linux PGlite worker, Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dblayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBLAYER_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/dblayer_test
      DBLAYER_CI_SHARD: pglite
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install the PGlite worker's npm packages
        run: npm ci --prefix pglite-worker && node pglite-worker/src/main.mjs --version
      - name: Run the PGlite family's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras --group demo pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  clickhouse:
    # ClickHouse embedded in-process (chDB, experimental): a pip extra.
    name: Linux ClickHouse, Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBLAYER_CI_SHARD: clickhouse
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run the ClickHouse family's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras --group demo pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  macos:
    name: macOS, Python 3.14
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      # The experimental C worker (cworker/): downloads the pinned SQLite
      # amalgamation and builds one binary, so the sqlite-cworker tests run.
      - name: Build the C worker
        run: make -C cworker
      # SQLite in WebAssembly (sqlite-wasm): a cached, checksummed wasi-sdk
      # plus about 10 s of compiling.
      - uses: actions/cache@v4
        with:
          path: cworker/vendor/wasi-sdk-34.0-*-*/
          key: wasi-sdk-34-${{ runner.os }}-${{ runner.arch }}
      - name: Build the SQLite WebAssembly module
        run: make -C cworker wasm
      # No PostgreSQL server here: those tests skip themselves.
      - name: Run tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  cworker-sanitizers:
    name: C worker under ASan + UBSan, and TSan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the C worker with -fsanitize=address,undefined
        run: make -C cworker SANITIZE=1
      # Any sanitizer report makes the worker exit non-zero (UBSan does not
      # recover), which fails the test that was using it. Memory-limit tests
      # are left out: on Linux they set RLIMIT_AS, which ASan's reserved
      # shadow memory does not survive (the first run hung in its test step).
      - name: Run the C worker's tests against the sanitized binary
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-asan/dblayer-cworker
          ASAN_OPTIONS: detect_leaks=0
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "(cworker or c-worker or cpool or c-pool) and not heap_limit and not rlimit and not memory_limit" tests/worker tests/faults tests/conformance
      # The multi-tenant C worker (--multi) is a threaded server: its own
      # tests under ThreadSanitizer. Ubuntu's 32-bit mmap randomisation
      # breaks TSan's memory layout, hence the sysctl. These steps run even
      # when the ASan step failed, so both sanitizers report.
      - name: Build the C worker with -fsanitize=thread
        if: ${{ !cancelled() }}
        run: make -C cworker SANITIZE=thread && sudo sysctl vm.mmap_rnd_bits=28
      - name: Run the multi-tenant C worker's tests under ThreadSanitizer
        if: ${{ !cancelled() }}
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-tsan/dblayer-cworker
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/cworker/tsan.supp
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "(cpool or c-pool or cworker_multi) and not rlimit" tests/worker/test_cworker_multi.py tests/worker/test_cpool.py tests/faults tests/conformance
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  duckdb-rs-worker:
    # The experimental Rust DuckDB worker (duckdb-rs-worker/): the pinned
    # prebuilt libduckdb (cached), a cargo build (cached), its Rust unit
    # tests, then every duckdb-rsworker test. Other jobs do not build it,
    # so those tests skip there.
    name: Rust DuckDB worker (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Rust pinned (also in the cache key), so a new stable's lints or
      # codegen do not change a run: 1.100 added the clippy lint that first
      # failed the SQLite job. Bump it on purpose, with clippy run locally.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && rustup default "$RUST_TOOLCHAIN" && rustc --version
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: duckdb-rs-worker/vendor/libduckdb
          key: libduckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('duckdb-rs-worker/fetch-libduckdb.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            duckdb-rs-worker/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('duckdb-rs-worker/Cargo.lock', 'duckdb-rs-worker/src/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Build the Rust DuckDB worker
        run: make -C duckdb-rs-worker && duckdb-rs-worker/target/release/dblayer-duckdb-rsworker --version
      - name: Rust unit tests
        run: make -C duckdb-rs-worker test
      - name: Run the Rust worker's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "rsworker or rust" tests/worker tests/faults tests/conformance
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  sqlite-rs-worker:
    # The experimental Rust port of the multi-tenant SQLite worker
    # (sqlite-rs-worker/): the C worker's pinned amalgamation (cached),
    # clippy, a cargo build (cached), the Rust unit tests and fuzz, then the
    # sqlite-rspool tests (the C worker's own tests run on it through
    # tests/native_impl.py). Other jobs do not build it, so they skip.
    name: Rust multi-tenant SQLite worker (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Rust pinned (also in the cache key), so a new stable's lints or
      # codegen do not change a run: 1.100 added the clippy lint that first
      # failed the SQLite job. Bump it on purpose, with clippy run locally.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && rustup default "$RUST_TOOLCHAIN" && rustc --version
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: cworker/vendor/sqlite-amalgamation-3530100.zip
          key: sqlite-amalgamation-3530100
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            sqlite-rs-worker/target
          key: cargo-sqlite-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('sqlite-rs-worker/Cargo.lock', 'sqlite-rs-worker/src/**', 'sqlite-rs-worker/build.rs') }}
          restore-keys: cargo-sqlite-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Build the Rust SQLite worker
        run: make -C sqlite-rs-worker && sqlite-rs-worker/target/release/dblayer-sqlite-rsworker --version
      - name: Clippy
        run: make -C sqlite-rs-worker clippy
      - name: Rust unit tests and fuzz
        run: make -C sqlite-rs-worker test
      - name: Run the Rust worker's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "rspool or rust" tests/worker tests/faults tests/conformance tests/scale
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  duckdb-cppworker:
    # The experimental DuckDB worker in C++ (duckdb-cpp-worker/): downloads
    # the pinned, checksummed prebuilt libduckdb (cached), builds, runs this
    # backend's tests, then again against an ASan + UBSan build. Other jobs
    # skip the duckdb-cppworker tests (binary not built).
    name: DuckDB C++ worker (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: duckdb-cpp-worker/vendor/libduckdb-*/
          key: libduckdb-2.0.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('duckdb-cpp-worker/fetch-libduckdb.sh') }}
      - name: Build the DuckDB C++ worker
        run: make -C duckdb-cpp-worker && duckdb-cpp-worker/build/dblayer-duckdb-worker --version
      - name: Run the DuckDB C++ worker's tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "cppworker or cpp" tests/worker tests/faults tests/conformance
      - name: Build it with -fsanitize=address,undefined
        run: make -C duckdb-cpp-worker SANITIZE=1
      # As for the C worker: RLIMIT_AS tests are left out under ASan, and so
      # are the export tests that wait seconds for an unbounded recursive
      # CTE's first rows (timing, not memory safety).
      - name: Run its tests against the sanitized binary
        env:
          DBLAYER_DUCKDB_CPP_WORKER: ${{ github.workspace }}/duckdb-cpp-worker/build-asan/dblayer-duckdb-worker
          ASAN_OPTIONS: detect_leaks=0
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "(cppworker or cpp) and not rlimit and not mid_stream and not unbounded" tests/worker tests/faults tests/conformance
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  stdlib-only:
    name: Core with no optional dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Proves the core and SQLite backends need only the standard library.
      - name: Run tests
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run pytest -ra
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true

  cworker-system-sqlite:
    # Informational: the C worker linked against Ubuntu's libsqlite3 instead
    # of the pinned amalgamation, to see what a different SQLite changes.
    name: C worker with the system libsqlite3 (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install libsqlite3-dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build the C worker against libsqlite3
        run: make -C cworker SQLITE=system BUILD=build-system && cworker/build-system/dblayer-cworker --version
      - name: Run the C worker's tests
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-system/dblayer-cworker
        run: |
          scripts/ci-diag.sh snapshot; scripts/ci-diag.sh monitor 60 & trap "kill $!" EXIT
          uv run --all-extras pytest -ra -k "cworker or c-worker" tests/worker tests/faults tests/conformance
      - name: Diagnostics after a failure or timeout
        if: failure() || cancelled()
        run: scripts/ci-diag.sh snapshot; cat hang-dump.txt 2>/dev/null || true
