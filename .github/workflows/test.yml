name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dblayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBLAYER_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/dblayer_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The experimental C worker (cworker/): downloads the pinned SQLite
      # amalgamation and builds one binary, so the sqlite-cworker tests run.
      - name: Build the C worker
        run: make -C cworker
      # SQLite in WebAssembly (sqlite-wasm): a cached, checksummed wasi-sdk
      # plus about 10 s of compiling.
      - uses: actions/cache@v4
        with:
          path: cworker/vendor/wasi-sdk-34.0-*-*/
          key: wasi-sdk-34-${{ runner.os }}-${{ runner.arch }}
      - name: Build the SQLite WebAssembly module
        run: make -C cworker wasm
      # SQLite-WASM in a Node.js process (nodeworker/, sqlite-nodeworker):
      # the pinned @sqlite.org/sqlite-wasm package, no build step.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install the Node worker's npm packages
        run: npm ci --prefix nodeworker
      # The demo group (starlette, httpx, ...) runs tests/demo against every
      # backend, PostgreSQL included; without it those tests skip.
      - name: Run tests with every optional backend and the demo app installed
        run: uv run --all-extras --group demo pytest -ra

  macos:
    name: macOS, Python 3.14
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      # The experimental C worker (cworker/): downloads the pinned SQLite
      # amalgamation and builds one binary, so the sqlite-cworker tests run.
      - name: Build the C worker
        run: make -C cworker
      # SQLite in WebAssembly (sqlite-wasm): a cached, checksummed wasi-sdk
      # plus about 10 s of compiling.
      - uses: actions/cache@v4
        with:
          path: cworker/vendor/wasi-sdk-34.0-*-*/
          key: wasi-sdk-34-${{ runner.os }}-${{ runner.arch }}
      - name: Build the SQLite WebAssembly module
        run: make -C cworker wasm
      # No PostgreSQL server here: those tests skip themselves.
      - name: Run tests
        run: uv run --all-extras pytest -ra

  cworker-sanitizers:
    name: C worker under ASan + UBSan, and TSan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the C worker with -fsanitize=address,undefined
        run: make -C cworker SANITIZE=1
      # Any sanitizer report makes the worker exit non-zero (UBSan does not
      # recover), which fails the test that was using it. Memory-limit tests
      # are left out: on Linux they set RLIMIT_AS, which ASan's reserved
      # shadow memory does not survive (the first run hung in its test step).
      - name: Run the C worker's tests against the sanitized binary
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-asan/dblayer-cworker
          ASAN_OPTIONS: detect_leaks=0
        run: >-
          uv run --all-extras pytest -ra
          -k "(cworker or c-worker or cpool or c-pool) and not heap_limit and not rlimit and not memory_limit"
          tests/worker tests/faults tests/conformance
      # The multi-tenant C worker (--multi) is a threaded server: its own
      # tests under ThreadSanitizer. Ubuntu's 32-bit mmap randomisation
      # breaks TSan's memory layout, hence the sysctl.
      - name: Build the C worker with -fsanitize=thread
        run: make -C cworker SANITIZE=thread && sudo sysctl vm.mmap_rnd_bits=28
      - name: Run the multi-tenant C worker's tests under ThreadSanitizer
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-tsan/dblayer-cworker
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/cworker/tsan.supp
        run: >-
          uv run --all-extras pytest -ra -k "(cpool or c-pool or cworker_multi) and not rlimit"
          tests/worker/test_cworker_multi.py tests/worker/test_cpool.py tests/faults

  duckdb-rs-worker:
    # The experimental Rust DuckDB worker (duckdb-rs-worker/): the pinned
    # prebuilt libduckdb (cached), a cargo build (cached), its Rust unit
    # tests, then every duckdb-rsworker test. Other jobs do not build it,
    # so those tests skip there.
    name: Rust DuckDB worker (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: duckdb-rs-worker/vendor/libduckdb
          key: libduckdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('duckdb-rs-worker/fetch-libduckdb.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            duckdb-rs-worker/target
          key: cargo-${{ runner.os }}-${{ hashFiles('duckdb-rs-worker/Cargo.lock', 'duckdb-rs-worker/src/**') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build the Rust DuckDB worker
        run: make -C duckdb-rs-worker && duckdb-rs-worker/target/release/dblayer-duckdb-rsworker --version
      - name: Rust unit tests
        run: make -C duckdb-rs-worker test
      - name: Run the Rust worker's tests
        run: uv run --all-extras pytest -ra -k "rsworker or rust" tests/worker tests/faults tests/conformance

  stdlib-only:
    name: Core with no optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Proves the core and SQLite backends need only the standard library.
      - name: Run tests
        run: uv run pytest -ra

  cworker-system-sqlite:
    # Informational: the C worker linked against Ubuntu's libsqlite3 instead
    # of the pinned amalgamation, to see what a different SQLite changes.
    name: C worker with the system libsqlite3 (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install libsqlite3-dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build the C worker against libsqlite3
        run: make -C cworker SQLITE=system BUILD=build-system && cworker/build-system/dblayer-cworker --version
      - name: Run the C worker's tests
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-system/dblayer-cworker
        run: uv run --all-extras pytest -ra -k "cworker or c-worker" tests/worker tests/faults tests/conformance
