name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dblayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBLAYER_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/dblayer_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The experimental C worker (cworker/): downloads the pinned SQLite
      # amalgamation and builds one binary, so the sqlite-cworker tests run.
      - name: Build the C worker
        run: make -C cworker
      # The demo group (starlette, httpx, ...) runs tests/demo against every
      # backend, PostgreSQL included; without it those tests skip.
      - name: Run tests with every optional backend and the demo app installed
        run: uv run --all-extras --group demo pytest -ra

  macos:
    name: macOS, Python 3.14
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      # The experimental C worker (cworker/): downloads the pinned SQLite
      # amalgamation and builds one binary, so the sqlite-cworker tests run.
      - name: Build the C worker
        run: make -C cworker
      # No PostgreSQL server here: those tests skip themselves.
      - name: Run tests
        run: uv run --all-extras pytest -ra

  cworker-sanitizers:
    name: C worker under ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the C worker with -fsanitize=address,undefined
        run: make -C cworker SANITIZE=1
      # Any sanitizer report makes the worker exit non-zero (UBSan does not
      # recover), which fails the test that was using it.
      - name: Run the C worker's tests against the sanitized binary
        env:
          DBLAYER_CWORKER: ${{ github.workspace }}/cworker/build-asan/dblayer-cworker
          ASAN_OPTIONS: detect_leaks=0
        run: uv run --all-extras pytest -ra -k "cworker or c-worker" tests/worker tests/faults tests/conformance

  stdlib-only:
    name: Core with no optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Proves the core and SQLite backends need only the standard library.
      - name: Run tests
        run: uv run pytest -ra
