<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}dblayer demo{% endblock %}</title>
{% block head %}{% endblock %}
<style>
body { font-family: system-ui, -apple-system, sans-serif; margin: 0; color: #222; background: #fff; line-height: 1.4; }
header { background: #2b3a55; color: #fff; padding: 0.6em 1em; }
header a { color: #fff; text-decoration: none; }
nav.crumbs { font-size: 0.9em; opacity: 0.9; }
main { padding: 1em; max-width: 100%; }
h1 { font-size: 1.5em; margin: 0.3em 0; }
h2 { font-size: 1.2em; margin-top: 1.4em; }
a { color: #1a5fb4; }
table.rows { border-collapse: collapse; font-size: 0.9em; }
table.rows th, table.rows td { border: 1px solid #ccc; padding: 0.25em 0.5em; text-align: left; vertical-align: top; max-width: 30em; overflow-wrap: anywhere; }
table.rows th { background: #eef1f6; position: sticky; top: 0; }
table.rows th .type { font-weight: normal; color: #666; font-size: 0.85em; }
.scroll { overflow-x: auto; }
.null { color: #999; font-style: italic; }
.blob, .meta { color: #666; font-size: 0.9em; }
.num { text-align: right; }
.unavailable { color: #a33; }
.error { background: #fdecea; border: 1px solid #e0a39c; padding: 0.6em 0.8em; color: #611; white-space: pre-wrap; }
.notice { background: #fff8e1; border: 1px solid #e6cf85; padding: 0.4em 0.8em; }
textarea { width: 100%; max-width: 60em; font-family: ui-monospace, Menlo, monospace; font-size: 0.95em; }
pre.sql { background: #f6f8fa; padding: 0.6em; overflow-x: auto; white-space: pre-wrap; }
ul.dbs li { margin-bottom: 0.6em; }
.pager a { margin-right: 1em; }
.grid { display: flex; flex-wrap: wrap; gap: 2px; font-size: 0.7em; font-family: ui-monospace, Menlo, monospace; }
.grid a { padding: 1px 3px; text-decoration: none; border-radius: 2px; }
.s-awake { background: #2e7d32; color: #fff; }
.s-asleep { background: #c8d8f0; color: #123; }
.s-cold { background: #eceff1; color: #556; }
.s-unavailable { background: #f3d3d0; color: #611; }
.legend span { padding: 1px 4px; border-radius: 2px; font-size: 0.85em; }
table.counts td a { text-decoration: none; }
.stats { display: flex; flex-wrap: wrap; gap: 0.4em 1.2em; background: #f6f8fa; border: 1px solid #dde; padding: 0.5em 0.8em; font-size: 0.9em; margin: 0.8em 0; }
.stats b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
<nav class="crumbs"><a href="/">dblayer demo</a>{% block crumbs %}{% endblock %}</nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
